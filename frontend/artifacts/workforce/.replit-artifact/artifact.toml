kind = "web"
previewPath = "/"
title = "Malaysia Tech Workforce"
description = "Evidence-based Malaysian technology skills dashboard, role matching and learning pathways built for job seekers."
version = "1.0.0"
id = "artifacts/workforce"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21728

[services.development]
run = "pnpm --filter @workspace/workforce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workforce", "run", "build" ]
serve = "static"
publicDir = "artifacts/workforce/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21728"
BASE_PATH = "/"
